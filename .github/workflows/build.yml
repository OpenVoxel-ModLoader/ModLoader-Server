name: Build server core

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch server JAR
        run: |
          mkdir -p server
          curl -sSL -o server/openvoxel-server.jar https://open-voxel.net/jars/openvoxel-server-0.0.8-SNAPSHOT.jar
      - name: Build
        run: ./gradlew --no-daemon jar
        env:
          OPENVOXEL_SERVER_JAR: server/openvoxel-server.jar
      - uses: actions/upload-artifact@v4
        with:
          name: ModLoader-server
          path: dist/*.jar
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
