# OpenVoxel ModLoader - server configuration
server:
  # Dedicated server JAR (download it from open-voxel.net). Relative to this folder, or absolute.
  # Leave empty to use OPENVOXEL_SERVER_JAR / server/openvoxel-server.jar / ../../../ServerTest/*.jar
  jar: ''
  port: 25565
  seed: 123456789
  # Local testing avoids launcher session-token validation.
  online-mode: false
  auth-server: https://open-voxel.net
  # auto-from-client means the --server-id argument is omitted intentionally.
  server-id: auto-from-client

gameplay:
  # Shown in the tab list and messages ({server}).
  server-name: OpenVoxel
  # Text under the server name in the multiplayer server list (ModLoader clients; needs the agent in agent/).
  # &colors supported, up to two lines separated with \n.
  motd: '&bAn OpenVoxel server\n&7running &eModLoader'
  # Chat message sent to players when they join (supports &colors and placeholders like {player}). Empty = none.
  welcome-message: '&7Welcome, &e{player}&7! Type &a/help&7.'
  # Game mode for new players with the ModLoader client: survival or creative. Change it per player with /gamemode (ops).
  default-gamemode: survival
  # 0 = unlimited. Operators can always join.
  max-players: 20
  # Only players added with /whitelist add can join (operators always can).
  whitelist: false
  whitelist-message: 'You are not whitelisted on this server.'

jvm:
  java: java
  min-memory: 1G
  max-memory: 4G
  use-g1gc: true

runtime:
  # Copy every JAR from mods/ into plugins/ before starting (the core ModLoader jar too).
  auto-deploy-mods: true
  write-latest-log: true
  crash-reports: true
